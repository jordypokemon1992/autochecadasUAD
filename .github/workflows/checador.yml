name: UAD Automation Runner (Firebase Driven)

on:
  workflow_dispatch: # Disparo exacto y prioritario vía Cron-Job.org / Webhook o manual
    inputs:
      target_user_id:
        description: 'Matrícula o ID específico de docente (opcional, deja "all" para todos)'
        required: false
        default: 'all'

# CONTROL DE CONCURRENCIA: Evita que existan 2 o más ejecuciones simultáneas del worker
concurrency:
  group: uad-attendance-runner-lock
  cancel-in-progress: false

jobs:
  execute-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Caché de Navegadores Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Instalar Dependencias del Worker
        run: |
          npm install --no-audit --no-fund --prefer-offline firebase dotenv playwright

      - name: Instalar Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          # Descarga directa de Chromium sin depender de repositorios ni apt-get de Ubuntu
          npx playwright install chromium

      - name: Ejecutar Checado Desatendido (Conectado a Firebase)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          TARGET_USER_INPUT: ${{ github.event.inputs.target_user_id || 'all' }}
          TIMEZONE: 'America/Mazatlan'
        run: node worker-firebase.js

