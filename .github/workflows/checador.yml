name: UAD Automation Runner (Firebase Driven)

on:
  schedule:
    # Se ejecuta a los 45 minutos de cada hora:
    # 06:45 AM hasta 21:45 PM (Los Mochis, Sinaloa / UTC-7)
    # 06:45 MST = 13:45 UTC ... 21:45 MST = 04:45 UTC del día siguiente
    # Lunes a Viernes
    - cron: '45 13-23 * * 1-5'
    - cron: '45 0-4 * * 2-6'
  workflow_dispatch: # Permite disparar manualmente o vía API externa (cron-job.org) en cualquier momento
    inputs:
      target_user_id:
        description: 'Matrícula o ID específico de docente (opcional, deja "all" para todos)'
        required: false
        default: 'all'

# CONTROL DE CONCURRENCIA: Evita que existan 2 o más ejecuciones simultáneas del worker
concurrency:
  group: uad-attendance-runner-lock
  cancel-in-progress: false

jobs:
  execute-attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar Dependencias y Playwright Chromium
        run: |
          npm install firebase dotenv playwright
          npx playwright install chromium --with-deps

      - name: Ejecutar Checado Desatendido (Conectado a Firebase)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          TARGET_USER_INPUT: ${{ github.event.inputs.target_user_id || 'all' }}
          TIMEZONE: 'America/Mazatlan'
        run: node worker-firebase.js

